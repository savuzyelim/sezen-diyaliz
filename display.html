<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Bekleme & Çağrı Ekranı - Hemodiyaliz Ünitesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body data-screen-mode="display">

  <!-- =========================================================================
       ÜST GLOBAL BİLGİ ŞERİDİ (TV BEKLEME SALONU EKRANI)
       ========================================================================= -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-logo">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1>HEMODİYALİZ ÜNİTESİ BEKLEME EKRANI</h1>
      </div>
    </div>

    <div class="header-right">
      <a href="sekreter.html" target="_blank" class="btn-open-external" title="Sekreter Yönetim Ekranını Yeni Sekmede Aç">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span>Sekreter Ekranı</span>
      </a>

      <!-- Bildirim Zili Aç / Kapa -->
      <button class="audio-toggle-btn active" id="sound-toggle-btn" onclick="toggleSound()" title="Kısa Bildirim Zilini Aç/Kapat">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span>Bildirim Zili: Açık</span>
      </button>

      <!-- Tam Ekran Butonu -->
      <button class="audio-toggle-btn" onclick="toggleFullscreen()" title="TV Tam Ekran Modu">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
        </svg>
        <span>Tam Ekran</span>
      </button>

      <!-- Canlı Saat -->
      <div class="live-clock">
        <svg width="16" height="16" fill="none" stroke="#38bdf8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <div>
          <div class="time" id="live-time">00:00:00</div>
          <div class="date" id="live-date">-</div>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       TAM EKRAN TV BEKLEME DISPLAY EKRANI (DİREKT SALON YAYINI)
       ========================================================================= -->
  <main class="split-workspace">
    <section class="panel-tv-display" aria-label="Hasta Bilgilendirme Ekranı">
      <div class="tv-top-bar">
        <div class="tv-badge-live">
          <span class="tv-dot-pulse"></span>
          <span>TV DISPLAY YAYIN EKRANI</span>
        </div>

        <div class="slide-indicator-container">
          <div class="slide-dots" id="tv-slide-dots">
            <!-- JS ile dinamik sayfalara göre butonlar üretilir -->
          </div>
          <div class="timer-pill" id="timer-pill">Sonraki Ekran: 15s</div>
        </div>
      </div>

      <!-- CAROUSEL VİTRİNİ (SAYFA BAŞINA MAX 4 HASTA - SCROLLBARSIZ VE OTOMATİK SAYFALAMALI) -->
      <div class="tv-carousel-viewport">
        <div class="tv-carousel-track" id="tv-carousel-track">
          <!-- JS ile renderTvSlides() fonksiyonunda dinamik slaytlar üretilir -->
        </div>
      </div>

      <!-- TV Alt Bilgi Kayan Mesaj Şeridi -->
      <footer class="tv-ticker-bar">
        <div class="ticker-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div class="ticker-text" id="tv-ticker-text">
          Hemodiyaliz Ünitesi Bilgilendirme: İlk diyaliz ön hazırlığı 30 dk, standart diyaliz seansları 3 saattir. Lütfen çağrıları ekrandan takip ediniz.
        </div>
      </footer>
    </section>
  </main>

  <div class="toast-box" id="toast"></div>

  <script src="app.js?v=9"></script>
</body>
</html>
